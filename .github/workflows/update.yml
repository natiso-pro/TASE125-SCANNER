
name: Update data and publish scanner

on:
  schedule:
    # Mon-Fri, every 30 min between 07:00 and 15:30 UTC (covers TASE hours, summer and winter)
    - cron: '0,30 7-15 * * 1-5'
    # one more run after the close, for end-of-day data and reports
    - cron: '15 16 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      # latest published data (so only new data is fetched); falls back to data.js from the repo
      - name: Download latest published data
        run: |
          curl -fsSL --max-time 60 "${{ steps.pages.outputs.base_url }}/data.js" -o data.latest.js || true
          if [ -s data.latest.js ] && head -c 20 data.latest.js | grep -q "TASE_DATA"; then
            mv data.latest.js data.js
            echo "Loaded data.js from the site"
          else
            echo "Using the initial data.js from the repo"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # if Yahoo blocks the run this step fails (email alert) but the site is still published with the previous data
      - name: Fetch data
        id: fetch
        continue-on-error: true
        run: python fetch_data.py

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js icon-*.png data.js _site/
          [ -f tickers_report.txt ] && cp tickers_report.txt _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # keeps GitHub from disabling the schedule after 60 days without repo activity
      - name: Keep schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "${{ github.repository }}"

      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Data fetch failed in this run (probably a temporary Yahoo block). The site is published with the previous data."
          exit 1

  deploy:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
